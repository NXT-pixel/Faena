<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faena Hub — Companion Dashboard</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #0f172a;
      --card: #131d31;
      --card-hover: #192640;
      --border: #223250;
      --border-accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-glow: rgba(59, 130, 246, 0.25);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.2);
      --warning: #f59e0b;
      --danger: #ef4444;
      --code-bg: #050811;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; font-size: 14px; min-height: 100vh; }
    
    .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    /* Top Navigation Bar */
    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 22px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      font-size: 22px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px var(--primary-glow);
    }
    .brand-title { font-size: 16px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .brand-subtitle { font-size: 12px; color: var(--text-muted); }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      letter-spacing: 0.04em;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .selector-group {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .select-item { display: flex; flex-direction: column; gap: 3px; }
    .select-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.05em; }
    .styled-selector {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      min-width: 170px;
      transition: border-color 0.15s ease;
    }
    .styled-selector:focus { border-color: var(--border-accent); }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
      transition: all 0.15s ease;
    }
    .btn-primary:hover { background: linear-gradient(135deg, #1d4ed8, #1e40af); transform: translateY(-1px); }

    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-secondary:hover { border-color: var(--border-accent); background: var(--card-hover); }

    /* Stepper Phases Card */
    .stepper-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stepper {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    @media (max-width: 840px) {
      .stepper { grid-template-columns: 1fr; }
    }
    .step-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 10px;
      text-align: center;
      transition: all 0.2s ease;
    }
    .step-item.completed { border-color: rgba(16, 185, 129, 0.5); background: rgba(16, 185, 129, 0.08); }
    .step-item.in_progress { border-color: rgba(245, 158, 11, 0.6); background: rgba(245, 158, 11, 0.08); }
    .step-num { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-dim); }
    .step-name { font-size: 13px; font-weight: 600; margin: 4px 0 2px 0; color: var(--text); }
    .step-status { font-size: 11px; font-weight: 600; margin-top: 4px; }
    .status-done { color: var(--success); }
    .status-running { color: var(--warning); animation: pulse 1.2s infinite; }
    .status-pending { color: var(--text-dim); }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    @media (max-width: 840px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .kpi-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .kpi-val { font-size: 18px; font-weight: 800; color: var(--text); margin: 6px 0 2px 0; }
    .kpi-desc { font-size: 11px; color: var(--text-dim); }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--surface);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      transition: width 0.4s ease;
    }

    /* Tabs & Content */
    .content-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 22px;
    }
    .tabs-header {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn:hover { color: var(--text); background: var(--card-hover); }
    .tab-btn.active { color: #fff; background: var(--surface); border: 1px solid var(--border); }

    /* Task Items */
    .task-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      transition: border-color 0.15s ease;
    }
    .task-item:hover { border-color: rgba(56, 189, 248, 0.4); }
    .task-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .task-checkbox { width: 18px; height: 18px; accent-color: var(--success); cursor: pointer; }
    .task-id { font-family: monospace; font-size: 12px; color: var(--text-dim); font-weight: 700; }
    .task-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    
    .badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.04em;
    }
    .badge-setup { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-red { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-green { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-agent { font-family: monospace; font-size: 11px; color: var(--text-muted); background: var(--card); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); }

    /* Multi-Tenant Overview Grid */
    .tenants-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px;
    }
    .tenant-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .tenant-card:hover { border-color: var(--border-accent); transform: translateY(-2px); }
    .tenant-card-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .tenant-card-title { font-weight: 700; font-size: 15px; color: var(--text); }
    .tenant-card-slug { font-size: 11px; font-family: monospace; color: var(--text-dim); }

    /* Context Editor */
    .editor-container { display: flex; flex-direction: column; gap: 12px; }
    .editor-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .editor-tab-btn {
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
    }
    .editor-tab-btn.active { color: #fff; border-color: var(--primary); background: rgba(59, 130, 246, 0.15); }
    .editor-textarea {
      width: 100%;
      height: 300px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #cbd5e1;
      font-family: Consolas, monospace;
      font-size: 13px;
      padding: 14px;
      line-height: 1.5;
      outline: none;
      resize: vertical;
    }
    .editor-textarea:focus { border-color: var(--border-accent); }

    /* Modern Native Dialog Styling (per Modern Web Guidance) */
    dialog#createTenantModal {
      margin: auto;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      color: var(--text);
      max-width: 520px;
      width: calc(100% - 40px);
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      overscroll-behavior: contain;
    }
    dialog#createTenantModal::backdrop {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      overscroll-behavior: contain;
    }
    .modal-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .modal-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #e2e8f0; }
    .form-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      color: #fff;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .form-input:focus { border-color: var(--border-accent); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }

    /* Onboarding Hero Component */
    .onboarding-hero {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 30px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .onboarding-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .onboarding-title { font-size: 26px; font-weight: 800; color: #fff; max-width: 650px; line-height: 1.3; }
    .onboarding-desc { color: var(--text-muted); max-width: 580px; font-size: 14px; line-height: 1.6; }
    .workflow-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      max-width: 900px;
      width: 100%;
      margin-top: 14px;
      text-align: left;
    }
    @media (max-width: 768px) {
      .workflow-cards { grid-template-columns: 1fr; }
    }
    .wf-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .wf-icon { font-size: 20px; margin-bottom: 8px; }
    .wf-title { font-weight: 700; font-size: 13px; color: #fff; margin-bottom: 4px; }
    .wf-text { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

    /* Tenant Empty State Box */
    .tenant-ready-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .prompt-box {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-family: monospace;
      font-size: 12px;
      color: #93c5fd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    /* Notification Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--card);
      border: 1px solid var(--primary);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      padding: 12px 18px;
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10000;
      animation: toastIn 0.2s ease;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Console / Logs */
    .log-viewer {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-family: Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      color: #cbd5e1;
      max-height: 380px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .gate-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .gate-title { font-weight: 700; font-size: 13px; color: var(--text); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .gate-code {
      background: var(--code-bg);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      color: #93c5fd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .copy-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .copy-btn:hover { color: #fff; border-color: var(--border-accent); }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- Top Bar -->
    <div class="header">
      <div class="brand">
        <div class="logo-icon">🏭</div>
        <div>
          <div class="brand-title">
            Faena Multi-Tenant Companion Hub
            <span class="status-badge"><span class="pulse-dot"></span> EN VIVO</span>
          </div>
          <div class="brand-subtitle" id="repo-subtitle">Gestión y monitoreo de tenants en tiempo real</div>
        </div>
      </div>
      
      <div class="selector-group">
        <div class="select-item" id="tenant-select-container">
          <span class="select-label">🏢 Tenant Activo:</span>
          <select id="tenantSelector" class="styled-selector" onchange="onSelectTenant(this.value)">
            <option value="">(No hay tenants creados)</option>
          </select>
        </div>

        <div class="select-item" id="ticket-select-container" style="display: none;">
          <span class="select-label">🎫 Ticket:</span>
          <select id="ticketSelector" class="styled-selector" onchange="onSelectTicket(this.value)">
            <option value="">Sin tickets en este tenant</option>
          </select>
        </div>

        <button class="btn-primary" onclick="openCreateTenantModal()" style="margin-top: 14px;">
          ➕ Nuevo Tenant
        </button>
      </div>
    </div>

    <!-- Main Dynamic Area: Changes between (A) Zero Tenants, (B) Tenant Ready, (C) Active Ticket -->
    <div id="main-view-container">
      <!-- Injected by JavaScript -->
    </div>

  </div>

  <!-- Native Modal Dialog (Clean Modern HTML Dialog per MWG) -->
  <dialog id="createTenantModal" aria-labelledby="modal-title">
    <div class="modal-title" id="modal-title">
      <span>🏢</span> Crear Nuevo Tenant
    </div>
    <div class="modal-desc">
      Inicializa un espacio de trabajo aislado (repositorios, contexto, tareas y memoria) sin clonar otro Faena.
    </div>

    <form onsubmit="submitCreateTenant(event)" method="dialog">
      <div class="form-group">
        <label class="form-label" for="newTenantSlug">Nombre / Identificador del Tenant (slug): *</label>
        <input type="text" id="newTenantSlug" class="form-input" placeholder="ej. retail-app, banco-movil" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="newTenantEmail">Email Corporativo Git (para commits en Proyecto/): *</label>
        <input type="email" id="newTenantEmail" class="form-input" placeholder="ej. santiago@cliente.com" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="form-group">
          <label class="form-label" for="newTenantTechLead">Tech Lead Asignado:</label>
          <input type="text" id="newTenantTechLead" class="form-input" placeholder="ej. Carlos Mendoza" value="Tech Lead">
        </div>
        <div class="form-group">
          <label class="form-label" for="newTenantQA">QA Engineer:</label>
          <input type="text" id="newTenantQA" class="form-input" placeholder="ej. Laura Sánchez" value="QA Engineer">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="newTenantStack">Stack Tecnológico Principal:</label>
        <input type="text" id="newTenantStack" class="form-input" placeholder="ej. .NET 8 / Angular 18, FastAPI / React" value=".NET 8 / Angular 18">
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="closeCreateTenantModal()">Cancelar</button>
        <button type="submit" class="btn-primary" id="btnSubmitTenant">Crear y Activar Tenant</button>
      </div>
    </form>
  </dialog>

  <!-- Toast Notification -->
  <div class="toast" id="toastNotification" style="display: none;">
    <span id="toastIcon">✓</span>
    <span id="toastMsg">Operación completada</span>
  </div>

  <script>
    let currentActiveTenant = '';
    let selectedTicketSlug = null;
    let currentTab = 'tasks';
    let currentContextTab = 'team';
    let cachedContextFiles = {};
    let latestServerData = null;

    // Accessible native dialog helpers
    const tenantDialog = document.getElementById('createTenantModal');
    
    // Light dismiss: click outside modal box closes dialog
    tenantDialog.addEventListener('click', (event) => {
      const rect = tenantDialog.getBoundingClientRect();
      const inBox = (rect.top <= event.clientY && event.clientY <= rect.top + rect.height &&
                     rect.left <= event.clientX && event.clientX <= rect.left + rect.width);
      if (!inBox) tenantDialog.close();
    });

    function openCreateTenantModal() {
      tenantDialog.showModal();
    }

    function closeCreateTenantModal() {
      tenantDialog.close();
    }

    function showToast(msg, icon = '✓') {
      const toast = document.getElementById('toastNotification');
      document.getElementById('toastIcon').innerText = icon;
      document.getElementById('toastMsg').innerText = msg;
      toast.style.display = 'flex';
      setTimeout(() => { toast.style.display = 'none'; }, 3200);
    }

    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.innerText;
        btn.innerText = "✓ Copiado";
        setTimeout(() => { btn.innerText = orig; }, 1500);
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      if (latestServerData) renderDashboard(latestServerData);
      if (tab === 'context') loadTenantDetails();
    }

    function switchContextTab(cTab) {
      currentContextTab = cTab;
      ['team', 'tech', 'standards', 'learnings'].forEach(t => {
        const btn = document.getElementById(`c-tab-${t}`);
        if (btn) btn.classList.toggle('active', t === cTab);
      });
      const editor = document.getElementById('contextEditor');
      if (!editor) return;
      if (cTab === 'team') editor.value = cachedContextFiles.team_context || '';
      else if (cTab === 'tech') editor.value = cachedContextFiles.tech_context || '';
      else if (cTab === 'standards') editor.value = cachedContextFiles.company_standards || '';
      else if (cTab === 'learnings') editor.value = cachedContextFiles.learnings || '';
    }

    function loadTenantDetails() {
      if (!currentActiveTenant) return;
      fetch(`/api/tenant_details?tenant=${encodeURIComponent(currentActiveTenant)}`)
        .then(res => res.json())
        .then(data => {
          cachedContextFiles = data;
          switchContextTab(currentContextTab);
          const help = document.getElementById('cloneHelpCmd');
          if (help) {
            help.innerText = `git clone <repo_url> tenants/${data.slug}/Proyecto/<repo>`;
          }
        });
    }

    function saveContextFile() {
      const editor = document.getElementById('contextEditor');
      if (!editor) return;
      fetch('/api/save_context', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          slug: currentActiveTenant,
          file_type: currentContextTab,
          content: editor.value
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          showToast('Contexto guardado exitosamente');
          loadTenantDetails();
        } else {
          alert('Error: ' + data.error);
        }
      });
    }

    function onSelectTenant(val) {
      currentActiveTenant = val;
      selectedTicketSlug = null;
      fetch(`/api/switch_tenant?tenant=${encodeURIComponent(val)}`)
        .then(() => {
          showToast(`Tenant activo: ${val}`);
          fetchStatus();
        });
    }

    function onSelectTicket(val) {
      selectedTicketSlug = val;
      fetchStatus();
    }

    function openTenantFolder() {
      if (!currentActiveTenant) return;
      fetch(`/api/open_folder?tenant=${encodeURIComponent(currentActiveTenant)}`)
        .then(() => showToast('Carpeta abierta en el Explorador'));
    }

    function submitCreateTenant(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitTenant');
      btn.innerText = 'Creando...';
      btn.disabled = true;

      const payload = {
        slug: document.getElementById('newTenantSlug').value.trim(),
        email: document.getElementById('newTenantEmail').value.trim(),
        tech_lead: document.getElementById('newTenantTechLead').value.trim(),
        qa: document.getElementById('newTenantQA').value.trim(),
        stack: document.getElementById('newTenantStack').value.trim()
      };

      fetch('/api/create_tenant', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        btn.innerText = 'Crear y Activar Tenant';
        btn.disabled = false;
        if (data.success) {
          closeCreateTenantModal();
          showToast(`Tenant "${data.slug}" creado y activado`);
          currentActiveTenant = data.slug;
          selectedTicketSlug = null;
          fetchStatus();
          switchTab('context');
        } else {
          alert('Error: ' + (data.error || 'No se pudo crear'));
        }
      })
      .catch(err => {
        btn.innerText = 'Crear y Activar Tenant';
        btn.disabled = false;
        alert('Error: ' + err);
      });
    }

    function renderTasksTab(data, tenantObj) {

          else if (t.phase.includes('green')) { badgeClass = 'badge-green'; phaseLabel = 'GREEN'; }

          html += `
            <div class="task-item">
              <div class="task-left">
                <input type="checkbox" ${t.completed ? 'checked' : ''} class="task-checkbox" disabled>
                <span class="task-id">task${t.id}</span>
                <span class="task-name">${t.name}</span>
              </div>
              <div style="display: flex; gap: 8px; align-items: center; shrink-0;">
                <span class="badge ${badgeClass}">${phaseLabel}</span>
                <span class="badge-agent">${t.agent}</span>
                <span style="font-size: 11px; font-weight: 700; color: ${t.completed ? 'var(--success)' : 'var(--text-dim)'}">

    /* Polling */
    function fetchStatus() {
      let url = '/api/status';
      const q = [];
      if (currentActiveTenant) q.push(`tenant=${encodeURIComponent(currentActiveTenant)}`);
      if (selectedTicketSlug) q.push(`ticket=${encodeURIComponent(selectedTicketSlug)}`);
      if (q.length > 0) url += `?${q.join('&')}`;

      fetch(url)
        .then(res => res.json())
        .then(data => renderDashboard(data))
        .catch(err => console.warn("Polling error:", err));
    }

    fetchStatus();
    setInterval(fetchStatus, 1400);
  </script>
</body>
</html>
